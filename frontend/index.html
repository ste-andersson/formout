<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <!--
      connect-src only allowlists 'self' and Clerk here. If the frontend is
      deployed cross-origin from the backend (VITE_API_BASE_URL points at a
      different origin, e.g. separate Railway services), add that backend
      origin to connect-src below or API calls will be blocked by the browser.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://concrete-grouse-746.clerk.accounts.dev https://clerk.formout.se https://challenges.cloudflare.com https://*.protect.clerk.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob: https://img.clerk.com;
        connect-src 'self' https://concrete-grouse-746.clerk.accounts.dev https://clerk.formout.se https://*.protect.clerk.com:* https://backend-production-5ae2.up.railway.app;
        frame-src https://concrete-grouse-746.clerk.accounts.dev https://clerk.formout.se https://challenges.cloudflare.com https://*.protect.clerk.com;
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <script src="/prefs-init.js"></script>
    <!-- Two icons, not one: the mark is dark-on-transparent in one file and
         light-on-transparent in the other, so it stays visible against the
         browser's own tab-bar background regardless of OS/browser dark mode
         -- this follows prefers-color-scheme, not the in-app theme picker
         (see lib/theme.ts), since it's the browser chrome reading it, not our JS. -->
    <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <!-- iOS ignores the manifest's icons for "Add to Home Screen", it only
         looks for this -- opaque background (not transparent) so it looks
         right regardless of wallpaper, same reasoning as the manifest icons
         below. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formout</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
