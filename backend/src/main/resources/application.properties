spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# Railway assigns the public port dynamically via $PORT.
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://localhost:5432/formout
spring.datasource.username=formout
spring.datasource.password=formout

spring.jpa.hibernate.ddl-auto=validate

app.security.clerk-issuer=https://concrete-grouse-746.clerk.accounts.dev
app.security.clerk-jwk-set-uri=https://concrete-grouse-746.clerk.accounts.dev/.well-known/jwks.json

# Origin allowed to call the API cross-origin, e.g. the frontend's Railway URL.
# Left blank (allow all) for local dev and same-origin deploys.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:}

app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=gpt-5.6

# Spring's defaults (1MB/10MB) reject photos straight from a phone camera,
# which easily exceed 1MB even after client-side resizing headroom and PDFs.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
