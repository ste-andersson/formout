services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: formout
      POSTGRES_USER: formout
      POSTGRES_PASSWORD: formout
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formout -d formout"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
